# docker compose run --rm harness2                       # demo (no credentials)
# docker compose run --rm harness2 bash                  # interactive shell
# docker compose run --rm harness2 harness2-setup jb     # install a benchmark into the volume
services:
  harness2:
    build:
      context: .
      args:
        INSTALL_GCLOUD: ${INSTALL_GCLOUD:-1}
        HARNESS2_EXTRAS: ${HARNESS2_EXTRAS:-render}
    image: harness2:local
    environment:
      PYTHONDONTWRITEBYTECODE: "1"   # keep __pycache__ out of ./module
    env_file:
      - path: harness2.env
        required: false
    extra_hosts:
      # Reach a model server on the host (vLLM/Ollama) at http://host.docker.internal:<port>
      - host.docker.internal:host-gateway
    volumes:
      # harness2 source from the host (editable install): clone + apply provider-refactor.patch, see ../README.md section 1
      - ./module:/opt/harness2
      # Benchmark checkouts/data stay in a Linux volume (large, needs symlinks + chmod)
      - deps:/opt/harness2/dependencies
      - ./runs:/opt/harness2/runs
      # Your own tasks in JobBench format (<domain>/<task>/task_folder/TASK_INSTRUCTIONS.txt + RUBRICS.json)
      - ./tasks:/opt/harness2/tasks:ro
      # Vertex AI: gcloud Application Default Credentials from the host.
      # Linux/macOS: ~/.config/gcloud   Windows: %APPDATA%/gcloud
      - ${GCLOUD_CONFIG_DIR:-~/.config/gcloud}:/home/harness/.config/gcloud
    stdin_open: true
    tty: true

volumes:
  deps:
