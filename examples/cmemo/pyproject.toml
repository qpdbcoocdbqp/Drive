[project]
name = "claude-memory-context-system"
version = "0.1.0"
description = "A Python module for memory management, token pruning, and context consolidation"
requires-python = ">=3.13"
dependencies = [
    "tiktoken>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["module"]
